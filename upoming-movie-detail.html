<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upcoming Showing</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .desc-block {
        gap: 100px;
      }
    </style>
  </head>
  <body>
    <div>
      <nav class="nav">
        <a href="/"
          ><img
            src="images/logo.png"
            alt="CineReserve"
            height="30px"
            width="170px"
        /></a>
      </nav>
    </div>
    <div class="desc-block">
      <img src="images/barbie.jpg" alt="jjk" class="movie-poster" />
      <div class="movie-info">
        <h6 class="movie_booking_type" style="margin-bottom: 8px">
          COMING SOON
        </h6>
        <div class="parent_movie_info_title">
          <h1 class="movie_info_title" style="margin-bottom: 8px">
            Barbie<span>&nbsp;(2024)</span>
          </h1>
        </div>
        <div class="movie_info_new" style="margin-bottom: 8px">
          <span class="movie_info_language" style="margin-right: 4px">
            134 mins
          </span>
          <span class="movie_info_rating">PG</span>
        </div>
        <section class="movie_info_more_details">
          <p class="movie_info_synopsis movie_info_synopsis_partial">
            This movie follows Barbie and Ken on a journey of self-discovery
            through Barbieland and the real world following an existential
            crisis.
          </p>
        </section>
      </div>
    </div>
  </body>
</html>
