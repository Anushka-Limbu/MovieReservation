<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Ticket Payment Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #333;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      .form-group select {
        height: 40px;
      }

      .submit-btn {
        width: 100%;
        padding: 15px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 18px;
        margin-top: 20px;
      }

      .submit-btn:hover {
        background-color: #218838;
      }

      .error {
        color: red;
        margin-top: -10px;
        margin-bottom: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Movie Ticket Payment</h2>

      <form id="ticketForm">
        <!-- Movie Selection -->
        <div class="form-group">
          <label for="movie">Select Movie</label>
          <select id="movie" required>
            <option value="">Select a Movie</option>
            <option value="movie1">Movie 1</option>
            <option value="movie2">Movie 2</option>
            <option value="movie3">Movie 3</option>
          </select>
        </div>

        <!-- Number of Tickets -->
        <div class="form-group">
          <label for="tickets">Number of Tickets</label>
          <input
            type="number"
            id="tickets"
            min="1"
            max="10"
            value="1"
            required
          />
        </div>

        <!-- Credit Card Payment Details -->
        <h3>Payment Details</h3>

        <div class="form-group">
          <label for="cardName">Cardholder's Name</label>
          <input
            type="text"
            id="cardName"
            placeholder="Enter Cardholder's Name"
            required
          />
        </div>

        <div class="form-group">
          <label for="cardNumber">Card Number</label>
          <input
            type="text"
            id="cardNumber"
            placeholder="Enter Card Number"
            required
            pattern="\d{16}"
          />
        </div>

        <div class="form-group">
          <label for="cardExpiry">Expiration Date (MM/YY)</label>
          <input
            type="text"
            id="cardExpiry"
            placeholder="MM/YY"
            required
            pattern="\d{2}/\d{2}"
          />
        </div>

        <div class="form-group">
          <label for="cardCvv">CVV</label>
          <input
            type="text"
            id="cardCvv"
            placeholder="CVV"
            required
            pattern="\d{3}"
          />
        </div>

        <button type="submit" class="submit-btn">Pay Now</button>
      </form>
    </div>

    <script>
      document
        .getElementById("ticketForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent form submission for validation

          // Basic validation (optional enhancement)
          const movie = document.getElementById("movie").value;
          const tickets = document.getElementById("tickets").value;
          const cardName = document.getElementById("cardName").value.trim();
          const cardNumber = document.getElementById("cardNumber").value.trim();
          const cardExpiry = document.getElementById("cardExpiry").value.trim();
          const cardCvv = document.getElementById("cardCvv").value.trim();

          if (
            !movie ||
            tickets < 1 ||
            !/^\d{16}$/.test(cardNumber) ||
            !/^\d{2}\/\d{2}$/.test(cardExpiry) ||
            !/^\d{3}$/.test(cardCvv)
          ) {
            alert("Please fill out all fields correctly.");
            return;
          }

          // Payment processing logic would go here

          alert("Payment submitted successfully!");
        });
    </script>
  </body>
</html>
